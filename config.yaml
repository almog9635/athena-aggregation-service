cache:
  ttlMs: 300000 
  baseTickMs: 5000 
  pollingIntervalMs: 600000 
  discoveryIntervalMs: 600000 
  pollingTimeRange:
    pastDays: 3
    futureDays: 3
  onDemandTimeRange:
    pastDays: 14
    futureDays: 30
  entitySettings:
    User:
      pollingIntervalMs: 10000 
      discoveryIntervalMs: 10000 
    Mission:
      pollingIntervalMs: 10000 
      discoveryIntervalMs: 10000 
  dataGroupMapping:
    UserBasic:
      - entityName: User
        fields:
          - name
          - email
        defaultTimeRange:
          pastDays: 3
          futureDays: 3
    UserHistory:
      - entityName: User
        fields:
          - loginHistory
        defaultTimeRange:
          pastDays: 30
          futureDays: 0
    MissionBasic:
      - entityName: Mission
        fields:
          - target
          - commanderId
        defaultTimeRange:
          pastDays: 3
          futureDays: 3
